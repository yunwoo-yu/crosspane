name: Release

# 버전 관리 체계 (changesets):
# 1. 기능/수정 PR에 `pnpm changeset`으로 변경 노트 추가 (patch/minor 선택)
# 2. main에 changeset이 쌓이면 이 워크플로가 "Version Packages" PR을 자동 생성
#    (버전 범프 + CHANGELOG.md 갱신)
# 3. 그 PR을 머지하면 npm 배포 + git 태그까지 자동
#
# 필요 시크릿: NPM_TOKEN — npmjs.com에서 Granular Access Token(퍼블리시 권한,
# 2FA bypass 허용)을 만들어 저장소 Settings > Secrets에 등록해야 자동 배포가 동작한다.
# 시크릿이 없으면 Version PR 생성까지만 동작하고 배포 스텝은 실패한다.

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # NPM_TOKEN 시크릿이 등록되기 전에는 배포 스텝을 조용히 건너뛴다
      - name: Check NPM token
        id: npm-token
        run: echo "present=${{ secrets.NPM_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Skip notice
        if: steps.npm-token.outputs.present != 'true'
        run: echo "NPM_TOKEN secret not set — skipping release (see workflow header comment)"

      - name: Create release PR or publish
        if: steps.npm-token.outputs.present == 'true'
        uses: changesets/action@v1
        with:
          publish: pnpm release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
