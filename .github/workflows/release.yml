name: Release

# 버전 관리 체계 (changesets):
# 1. 기능/수정 PR에 `pnpm changeset`으로 변경 노트 추가 (patch/minor 선택)
# 2. main에 changeset이 쌓이면 이 워크플로가 "Version Packages" PR을 자동 생성
#    (버전 범프 + CHANGELOG.md 갱신)
# 3. 그 PR을 머지하면 npm 배포 + git 태그까지 자동
#
# 인증 (둘 중 하나가 있어야 배포 스텝이 실행된다):
# - 권장: npm Trusted Publishing (OIDC, 토큰 없음)
#   npmjs.com 패키지 Settings → Trusted Publisher에 이 저장소/워크플로를 등록한 뒤
#   GitHub 저장소 Settings → Variables에 NPM_TRUSTED_PUBLISHER=true 를 추가
# - 대안: NPM_TOKEN 시크릿 (granular token) — 장기 토큰이라 비권장

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm Trusted Publishing(OIDC)에 필요

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm 버전은 루트 package.json의 packageManager 필드가 단일 소스다
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # OIDC 기반 publish는 npm 11.5.1+ 필요 (Node 22 번들 npm은 10.x)
      - name: Update npm for OIDC publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 인증 수단이 준비되기 전에는 배포 스텝을 조용히 건너뛴다
      - name: Check publish auth
        id: auth
        run: |
          if [ "${{ vars.NPM_TRUSTED_PUBLISHER }}" = "true" ] || [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No npm auth configured — skipping release (see workflow header comment)"
          fi

      # 배포 직전 최종 게이트 — release는 main push 즉시 돌므로 CI 완주를 기다리지 않는다.
      # 최소한 lint+test를 여기서 한 번 더 돌려 깨진 커밋의 publish를 막는다
      # 빌드는 여기서 미리 — publish 입력은 단일 커맨드만 허용된다 (셸 해석 없음)
      - name: Verify and build before publish
        if: steps.auth.outputs.ready == 'true'
        run: pnpm exec biome ci . && pnpm test && pnpm build

      - name: Create release PR or publish
        if: steps.auth.outputs.ready == 'true'
        uses: changesets/action@v1
        with:
          # changeset publish 미사용 — pnpm publish 경유 시 --git-checks가 최신
          # npm에서 에러가 된다. 사유와 대체 절차는 scripts/ci-publish.mjs 주석 참조
          # (publish 입력은 셸 미해석이므로 단일 커맨드여야 한다)
          publish: node scripts/ci-publish.mjs
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # OIDC가 있는 CI에서만 provenance 첨부 — 로컬 수동 publish는 영향 없음
          NPM_CONFIG_PROVENANCE: 'true'
