name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    # 코어는 모든 OS에서 동작해야 한다 — Windows 경로/실행 회귀를 CI에서 잡는다.
    # Node는 engines 하한(20)과 최신 LTS(22)를 모두 검증 — 하한은 ubuntu에서만 (매트릭스 비용 절충)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 20
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # pnpm 버전은 루트 package.json의 packageManager 필드가 단일 소스다
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm exec biome ci .

      - name: Typecheck
        run: pnpm typecheck

      - name: Publishable package check
        run: pnpm check:publishable

      # 커버리지 임계값은 회귀 방지 래칫이다 (vitest.shared.ts). 대표 레그에서만 재고
      # 나머지 레그는 테스트만 돌린다 — 6개 레그에서 다 재는 것은 낭비다
      - name: Test
        if: matrix.os != 'ubuntu-latest' || matrix.node != 22
        run: pnpm test

      - name: Test with coverage thresholds
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: pnpm coverage

      - name: Build
        run: pnpm build

  # 유닛테스트가 못 잡는 회귀를 실기동으로 검증 — 허브 기동, 에이전트 왕복,
  # 히스토리 재생. 대시보드 정적 서빙까지 포함해 배포본 형태로 확인한다
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm 버전은 루트 package.json의 packageManager 필드가 단일 소스다
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Smoke test
        run: pnpm smoke
