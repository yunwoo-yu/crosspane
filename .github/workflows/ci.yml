name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    # 코어는 모든 OS에서 동작해야 한다 — Windows 경로/실행 회귀를 CI에서 잡는다.
    # Node는 engines 하한(20)과 최신 LTS(22)를 모두 검증 — 하한은 ubuntu에서만 (매트릭스 비용 절충)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 20
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # pnpm 버전은 루트 package.json의 packageManager 필드가 단일 소스다
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm exec biome ci .

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # 유닛테스트가 못 잡는 회귀(엔진 기동/프레임 스트림/입력 미러링)를 실기동으로 검증
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 버전은 루트 package.json의 packageManager 필드가 단일 소스다
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter crosspane exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Smoke test
        run: pnpm smoke
