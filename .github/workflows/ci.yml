name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    # 코어는 모든 OS에서 동작해야 한다 — Windows 경로/실행 회귀를 CI에서 잡는다
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm exec biome ci .

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
