# 보안 민감 의존성(playwright, ws, grpc-js 등)의 수동 관리 탈피 —
# 주 1회 묶음 PR로 소음은 낮게, 취약점 패치는 놓치지 않게
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
    open-pull-requests-limit: 5
    ignore:
      # jsdom 30+은 Node 22 전용 (webidl markAsUncloneable) — 우리 CI는
      # 배포 패키지의 하한인 Node 20 레그를 유지하므로 26.x에 고정
      - dependency-name: jsdom
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # 액션 버전 범프는 개별 PR로 쪼개면 소음만 크다 — 주 1회 PR 하나로 묶는다
    groups:
      github-actions:
        patterns: ['*']
